name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: find core -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

  build:
    name: Build & Push Image
    needs: [lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -oP 'DEFAULT_VERSION\s*=\s*"\K[^"]+' core/inkdrop_version.py || echo "dev")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/inkdrop:latest
            ghcr.io/${{ github.repository_owner }}/inkdrop:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=inkdrop
          cache-to: type=gha,mode=max,scope=inkdrop
          build-args: |
            INKDROP_VERSION=${{ steps.meta.outputs.version }}
            INKDROP_COMMIT_SHA=${{ github.sha }}
            INKDROP_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            INKDROP_RELEASE_CHANNEL=stable

      - name: Summarize
        run: |
          {
            echo "## Image published"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/inkdrop:latest\`"
            echo "- \`ghcr.io/${{ github.repository_owner }}/inkdrop:sha-${{ steps.meta.outputs.short_sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"