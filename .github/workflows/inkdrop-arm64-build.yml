name: inkdrop-arm64-build

on:
  push:
    branches:
      - main
      - qa
    paths:
      - ".github/workflows/inkdrop-arm64-build.yml"
      - "Dockerfile"
      - "requirements.txt"
      - "inkdrop*.py"
      - "inkdrop_*.py"
      - "web/static/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: inkdrop-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_arm64:
    name: Build arm64 native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.build_meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build metadata
        id: build_meta
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/inkdrop-arm64:sha-${{ steps.build_meta.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/inkdrop-arm64:${{ github.ref_name }}-${{ steps.build_meta.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/inkdrop-arm64:${{ github.ref_name }}
          build-args: |
            INKDROP_VERSION=${{ github.ref_name }}
            INKDROP_COMMIT_SHA=${{ github.sha }}
            INKDROP_BUILD_DATE=${{ steps.build_meta.outputs.created }}
            INKDROP_RELEASE_CHANNEL=${{ github.ref_name }}
            INKDROP_QA_BUILD_NUMBER=${{ github.run_number }}

      - name: Verify image architecture
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/inkdrop-arm64@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          arch="$(docker inspect "$image" --format '{{.Architecture}}')"
          if [ "$arch" != "arm64" ]; then
            echo "ERROR: expected arm64, got $arch"
            exit 1
          fi
          echo "Verified: $arch"

      - name: Run container preflight on arm64
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/inkdrop-arm64@${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint python \
            -e INKDROP_CONFIG_DIR=/tmp/inkdrop/config \
            -e INKDROP_STATE_DIR=/tmp/inkdrop/state \
            -e INKDROP_LOCK_DIR=/tmp/inkdrop/state/locks \
            -e INKDROP_LOG_DIR=/tmp/inkdrop/state/logs \
            -e INKDROP_CACHE_DIR=/tmp/inkdrop/state/cache \
            -e INKDROP_BACKUP_DIR=/tmp/inkdrop/state/backups \
            -e INKDROP_STAGING_DIR=/tmp/inkdrop/staging \
            -e INKDROP_MANUAL_INBOX_DIR=/tmp/inkdrop/manual-inbox \
            -e INKDROP_QUARANTINE_DIR=/tmp/inkdrop/state/quarantine \
            "$image" -B inkdrop_preflight.py --create --quiet --strict-dependencies --strict-runtime-tools

      - name: Summarize arm64 build
        run: |
          {
            echo "## arm64 native build"
            echo
            echo "- Runner: \`ubuntu-24.04-arm\` (native, no QEMU)"
            echo "- Platform: \`linux/arm64\`"
            echo "- Tags:"
            echo "  - \`ghcr.io/${{ github.repository_owner }}/inkdrop-arm64:sha-${{ steps.build_meta.outputs.short_sha }}\`"
            echo "  - \`ghcr.io/${{ github.repository_owner }}/inkdrop-arm64:${{ github.ref_name }}-${{ steps.build_meta.outputs.short_sha }}\`"
            echo "  - \`ghcr.io/${{ github.repository_owner }}/inkdrop-arm64:${{ github.ref_name }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Architecture verified: \`arm64\`"
            echo "- Preflight: passed"
          } >> "$GITHUB_STEP_SUMMARY"
